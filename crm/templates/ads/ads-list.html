{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Рекламные компании</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="hstack gap-3 pb-4">
        <a href="/ads/new" class="btn btn-success p-2">Создать</a>
        <a href="/ads/statistic" class="btn btn-primary p-2">Статистика</a>
    </div>
    <div class="col">
        <ul class="list-group">
            {% for ad in ads %}
            <li class="list-group-item list-group-item-light d-flex justify-content-between align-items-center">
                <span>
                    {{ ad.name }}
                    <span class="badge bg-secondary ms-2">Лидов: {{ ad.leads_count|default:0 }}</span>
                    <span class="badge bg-success ms-2">Клиентов: {{ ad.customers_count|default:0 }}</span>
                </span>
                <div>
                    <a href="{% url 'ads:detail' ad.pk %}" class="btn btn-sm btn-info">Детали</a>
                    <a href="{% url 'ads:edit' ad.pk %}" class="btn btn-sm btn-primary">Редактировать</a>
                    <a href="{% url 'ads:delete' ad.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
