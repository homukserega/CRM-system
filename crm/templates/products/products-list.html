{% extends "_base.html" %}

{% block content %}
<h2 class="fw-bold">Услуги</h2>
<div class="row bg-white px-3 py-3 mx-2 my-5 rounded pb-5 shadow-lg">
    <div class="hstack gap-3 pb-4">
        <a href="{% url 'products:create' %}" class="btn btn-success p-2">Создать</a>
    </div>
    <div class="col">
        <ul class="list-group">
            {% for product in products %}
            <li class="list-group-item list-group-item-light d-flex justify-content-between align-items-center">
                <span>{{ product.name }}</span>
                <div>
                    <a href="{% url 'products:detail' product.pk %}" class="btn btn-sm btn-info">Детали</a>
                    <a href="{% url 'products:edit' product.pk %}" class="btn btn-sm btn-primary">Редактировать</a>
                    <a href="{% url 'products:delete' product.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
