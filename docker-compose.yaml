services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXT_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./postgresql_conf/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    stop_signal: SIGKILL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - crm-network

  app:
    build: .
    command: >
      sh -c "python crm/manage.py migrate &&
             python crm/manage.py init_roles &&
             python crm/manage.py collectstatic --noinput &&
             gunicorn --chdir crm crm.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - .env
    environment:
      # локальный запуск django POSTGRES_HOST: localhost
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/crm/staticfiles
      - media_data:/app/crm/media
    networks:
      - crm-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/vol/static/
      - media_data:/vol/media/
    depends_on:
      - app
    networks:
      - crm-network

volumes:
  db_data:
  static_data:
  media_data:

networks:
  crm-network:
    driver: bridge