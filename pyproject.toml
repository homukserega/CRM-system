[project]
name = "CRM-system"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [
    { name = "Сергей Хомук", email = "homuk.serega@yandex.by" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.2,<7.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "gunicorn[standard]>=26.0.0",
    "django-unused-media>=0.2.2",
    "djangorestframework>=3.16.1",
    "drf_spectacular",
]

[dependency-groups]
# Группа для разработки (включает все production зависимости + dev инструменты)
development = [
    "django>=6.0.2,<7.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "django-debug-toolbar>=7.0.0,<8.0.0",
    "gunicorn[standard]>=26.0.0",
    "django-unused-media>=0.2.2",
    "djangorestframework>=3.16.1",
    "drf_spectacular",
    "pylint>=4.0.6,<5.0.0",
    "pylint-django>=2.8.0",
    "ruff>=0.6.0,<1.0.0",
]

# Группа для production (только основные зависимости)
production = [
    "django>=6.0.2,<7.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "django-debug-toolbar>=7.0.0,<8.0.0",
    "gunicorn[standard]>=26.0.0",
    "django-unused-media>=0.2.2",
    "djangorestframework>=3.16.1",
    "drf_spectacular",
]

# --- Конфигурация Ruff ---
[tool.ruff]
# Основные настройки
target-version = "py312"
line-length = 100
src = ["."]

# Правила линтинга
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
    "DJ",  # Django-specific rules
]

lint.ignore = [
    "D100", "D104", "D203", "D212", "D401",
    "B008", "B904", "RUF012",
]

lint.fixable = ["ALL"]

# isort
[tool.ruff.lint.isort]
known-first-party = ["crm", "accounts", "products", "ads", "leads", "customers", "contracts"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# Django
[tool.ruff.lint.flake8-django]
settings-module = "crm.settings"

# Исключения для конкретных файлов
[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["D", "S101"]
"*/models.py" = ["D", "RUF012"]
"*/admin.py" = ["D"]
"*/apps.py" = ["D"]
"*/migrations/*" = ["ALL"]
